<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>多人抽签</title>
<!-- Firebase SDK (compat 版，无需构建，可直接托管到静态站点) -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
:root{
  --gold:#f6c453; --gold-soft:#ffe08a;
  --ink:#f4f1e8; --muted:rgba(244,241,232,.55);
  --glass:rgba(255,255,255,.06); --line:rgba(255,215,106,.22);
  --cyan:#4fe0cb;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  min-height:100vh;color:var(--ink);
  background:radial-gradient(120% 70% at 50% -10%, #172454 0%, #0a1128 48%, #04060f 100%);
  overflow-x:hidden;
  display:flex;flex-direction:column;align-items:center;
  padding:22px 14px 44px;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(3px 3px at 18% 22%, rgba(246,196,83,.55), transparent 60%),
    radial-gradient(2px 2px at 82% 30%, rgba(79,224,203,.5), transparent 60%),
    radial-gradient(3px 3px at 70% 68%, rgba(246,196,83,.4), transparent 60%),
    radial-gradient(2px 2px at 28% 78%, rgba(246,196,83,.35), transparent 60%);
  animation:drift 14s linear infinite;
}
@keyframes drift{0%{transform:translateY(0);}50%{transform:translateY(-10px);}100%{transform:translateY(0);}}
.wrap{width:100%;max-width:420px;position:relative;z-index:1;}
header{text-align:center;margin-bottom:22px;}
.logo{
  width:58px;height:58px;margin:0 auto 12px;border-radius:18px;
  background:linear-gradient(135deg,var(--gold),var(--gold-soft));
  display:flex;align-items:center;justify-content:center;font-size:30px;
  box-shadow:0 10px 26px rgba(246,196,83,.35);
}
header h1{
  font-size:24px;letter-spacing:6px;color:var(--ink);font-weight:700;
  user-select:none;cursor:pointer;display:inline-block;padding:4px 12px;
}
header p{color:var(--muted);font-size:13px;letter-spacing:2px;margin-top:6px;}
.card{
  background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--line);border-radius:18px;padding:18px 16px;
  box-shadow:0 14px 44px rgba(0,0,0,.45);margin-bottom:18px;
}
.card h2{font-size:15px;color:var(--gold);margin-bottom:12px;letter-spacing:3px;}
.input-row{display:flex;gap:8px;}
.input-row input{
  flex:1;min-width:0;padding:12px 14px;border:1px solid var(--line);border-radius:12px;
  font-size:15px;outline:none;background:rgba(255,255,255,.04);color:var(--ink);
}
.input-row input::placeholder{color:var(--muted);}
.input-row input:focus{border-color:var(--gold);}
.input-row button{
  padding:12px 20px;border:none;border-radius:12px;
  background:linear-gradient(135deg,var(--gold),var(--gold-soft));color:#1a1506;
  font-size:15px;font-weight:800;cursor:pointer;transition:transform .15s,box-shadow .15s;
  box-shadow:0 6px 18px rgba(246,196,83,.28);
}
.input-row button:hover{transform:scale(1.04);}
.input-row button:active{transform:scale(.96);}
.names{list-style:none;margin-top:12px;display:flex;flex-wrap:wrap;gap:8px;min-height:10px;}
.names li{
  background:rgba(246,196,83,.1);border:1px solid rgba(246,196,83,.2);
  border-radius:20px;padding:6px 14px;font-size:14px;color:var(--ink);
}
.count{font-size:12px;color:var(--muted);margin-top:12px;}

.stage{text-align:center;margin-top:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.pool{
  width:230px;height:230px;max-width:82vw;border-radius:50%;
  background:radial-gradient(circle at 50% 32%, rgba(246,196,83,.16), rgba(246,196,83,.03) 62%, transparent);
  border:1px dashed rgba(255,215,106,.35);
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;
  box-shadow:0 0 70px rgba(246,196,83,.12), inset 0 0 42px rgba(246,196,83,.06);
  margin-bottom:14px;
}
#status{font-size:12px;color:var(--muted);letter-spacing:3px;margin-bottom:12px;}
#resultName{
  font-size:46px;font-weight:800;color:var(--gold);opacity:.38;
  min-width:120px;text-align:center;transition:opacity .3s,color .3s;
  line-height:1.05;word-break:break-all;
}
#resultName.show{
  opacity:1;color:var(--gold-soft);text-shadow:0 0 26px rgba(246,196,83,.6);
  animation:pop .55s cubic-bezier(.2,.7,.3,1.3);
}
#resultSub{font-size:13px;color:var(--muted);letter-spacing:2px;margin-top:14px;min-height:18px;}
@keyframes pop{0%{transform:scale(.6);opacity:0;}60%{transform:scale(1.12);}100%{transform:scale(1);opacity:1;}}
#confetti{position:fixed;top:0;left:0;pointer-events:none;z-index:998;}

#toast{
  position:fixed;left:50%;bottom:44px;transform:translateX(-50%);
  background:rgba(18,24,52,.95);border:1px solid var(--line);color:var(--ink);
  padding:10px 18px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .3s;z-index:1001;
}

.overlay{position:fixed;inset:0;background:rgba(3,5,13,.74);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px;}
.panel{
  background:rgba(19,25,50,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid var(--line);border-radius:20px;padding:22px 18px;width:100%;max-width:340px;
  max-height:90vh;overflow:auto;box-shadow:0 24px 70px rgba(0,0,0,.6);
}
.panel h3{font-size:17px;color:var(--gold);margin-bottom:16px;text-align:center;letter-spacing:2px;}
.panel .field{margin-bottom:14px;}
.panel label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;}
.panel input,.panel select{
  width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px;outline:none;
  background:rgba(255,255,255,.05);color:var(--ink);
}
.panel select option{background:#131936;color:var(--ink);}
.panel .switch{display:flex;align-items:center;justify-content:space-between;}
.panel .switch label{margin-bottom:0;}
.panel .row{display:flex;gap:8px;margin-bottom:10px;}
.panel .row button{flex:1;padding:11px;border:none;border-radius:10px;font-size:14px;cursor:pointer;transition:transform .12s;}
.panel .row button:active{transform:scale(.97);}
.btn-primary{background:linear-gradient(135deg,var(--gold),var(--gold-soft));color:#1a1506;font-weight:700;}
.btn-danger{background:rgba(255,107,107,.14);color:#ff9d9d;border:1px solid rgba(255,107,107,.28);}
.btn-cancel{background:rgba(255,255,255,.08);color:var(--muted);border:1px solid rgba(255,255,255,.1);}
#drawFullBtn{
  width:100%;padding:16px;border:none;border-radius:100px;
  background:linear-gradient(135deg,var(--gold),var(--gold-soft));color:#1a1506;
  font-size:18px;font-weight:800;cursor:pointer;letter-spacing:6px;
  margin-bottom:8px;animation:breathe 2.2s ease-in-out infinite;transition:transform .15s;
}
#drawFullBtn:hover{transform:scale(1.02);}
#drawFullBtn:active{transform:scale(.97);}
@keyframes breathe{
  0%,100%{box-shadow:0 0 16px rgba(246,196,83,.35),0 0 0 0 rgba(246,196,83,.4);}
  50%{box-shadow:0 0 30px rgba(246,196,83,.6),0 0 0 12px rgba(246,196,83,0);}
}
.hidden{display:none!important;}
#pinerror{color:#ff9d9d;font-size:13px;text-align:center;margin-top:8px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">🎲</div>
    <h1 id="title">多人抽签</h1>
    <p>输入名字加入，等待主持人开奖</p>
  </header>

  <div class="card">
    <h2>报名</h2>
    <div class="input-row">
      <input id="nameInput" placeholder="输入你的名字" />
      <button id="joinBtn">加入</button>
    </div>
    <ul class="names" id="nameList"></ul>
    <div class="count" id="count"></div>
  </div>

  <div class="stage">
    <div class="pool">
      <div id="status">等待抽签</div>
      <div id="resultName">—</div>
    </div>
    <div id="resultSub"></div>
  </div>
</div>

<canvas id="confetti"></canvas>
<div id="toast"></div>

<!-- 管理员密码 -->
<div class="overlay hidden" id="pinOverlay">
  <div class="panel">
    <h3>请输入管理密码</h3>
    <div class="field"><input id="pinInput" type="password" placeholder="输入密码" /></div>
    <div class="row">
      <button class="btn-cancel" id="pinCancel">取消</button>
      <button class="btn-primary" id="pinOk">确认</button>
    </div>
    <div id="pinerror"></div>
  </div>
</div>

<!-- 管理面板（仅主持人） -->
<div class="overlay hidden" id="secretOverlay">
  <div class="panel">
    <h3>管理面板（仅主持人）</h3>
    <button id="drawFullBtn">开 始 抽 签</button>
    <div class="field switch">
      <label>开启内定（指定必中）</label>
      <input type="checkbox" id="riggedToggle" />
    </div>
    <div class="field">
      <label>内定中奖者</label>
      <select id="riggedSelect"></select>
    </div>
    <div class="field">
      <label>删除报名人</label>
      <div class="row" style="margin-bottom:0;">
        <select id="removeSelect" style="flex:1;min-width:0;"></select>
        <button class="btn-danger" id="removeBtn" style="flex:0 0 auto;">删除</button>
      </div>
    </div>
    <div class="field">
      <label>修改管理密码</label>
      <input id="newPin" type="text" placeholder="留空则不修改" />
    </div>
    <div class="row">
      <button class="btn-danger" id="resetBtn">清空名单</button>
      <button class="btn-cancel" id="secretCancel">关闭</button>
    </div>
  </div>
</div>

<script>
(function(){
  const $ = id => document.getElementById(id);

  // =====================================================
  // 1. 请在这里填入你的 Firebase 配置（Firebase 控制台 → 项目设置 → 添加 Web 应用）
  // =====================================================
  const firebaseConfig = {
    apiKey: "AIzaSyDPJTimDBYmaEgJN13TJ5Hsw305Fc1nrxM",
    authDomain: "my-person-random-choose.firebaseapp.com",
    projectId: "my-person-random-choose",
    storageBucket: "my-person-random-choose.firebasestorage.app",
    messagingSenderId: "102737831200",
    appId: "1:102737831200:web:41733d6a40db7125b56345",
    measurementId: "G-K974HE72LT",
  };

  // 房间号：同一场活动用同一个 room 参数；不同活动换不同 room 即可隔离
  const ROOM = new URLSearchParams(location.search).get('room') || 'room1';

  if (!firebaseConfig.projectId || firebaseConfig.projectId.indexOf('在这里填') !== -1) {
    alert('请先在 index.html 顶部填入你的 Firebase 配置（projectId 等）');
  } else {
    firebase.initializeApp(firebaseConfig);
  }
  const db = firebase.firestore();
  const roomRef = db.collection('draws').doc(ROOM);

  // ---- 内定配置：只存在于主持人本地，绝不写入云端 ----
  const LS_PIN='drawAdminPin', LS_RIG='drawRigged', LS_RIGNAME='drawRiggedName';
  const defaultPin = '2026';
  let riggedEnabled = localStorage.getItem(LS_RIG)==='1';
  let riggedName = localStorage.getItem(LS_RIGNAME)||'';

  const nameInput=$('nameInput'), joinBtn=$('joinBtn'), nameList=$('nameList'),
        count=$('count'), statusEl=$('status'), resultName=$('resultName');

  let names = [];        // 当前名单（按报名时间排序）
  let lastSession = null;
  let rolling = false;

  function renderNames(){
    nameList.innerHTML='';
    names.forEach(n=>{
      const li=document.createElement('li');
      li.textContent=n;
      nameList.appendChild(li);
    });
    count.textContent = names.length ? '共 ' + names.length + ' 人' : '';
    updateRiggedSelect();
    updateRemoveSelect();
  }

  function join(){
    const name = nameInput.value.trim();
    if(!name) return;
    if(names.includes(name)){ toast('这个名字已在名单里'); return; }
    // Firestore 用「定点更新」写入，多人同时加入不会互相覆盖
    roomRef.update({ ['participants.'+name]: Date.now() })
      .then(()=>{ nameInput.value=''; toast('已加入名单'); })
      .catch(()=>{
        // 文档还不存在时先创建
        roomRef.set({ participants: { [name]: Date.now() } }, { merge: true })
          .then(()=>{ nameInput.value=''; toast('已加入名单'); })
          .catch(e=>toast('加入失败：'+e.message));
      });
  }
  joinBtn.onclick=join;
  nameInput.addEventListener('keydown',e=>{ if(e.key==='Enter') join(); });

  // ---- 实时监听云端数据 ----
  roomRef.onSnapshot(snap=>{
    const data = snap.exists ? snap.data() : {};
    const participants = data.participants || {};
    names = Object.keys(participants).sort((a,b)=>participants[a]-participants[b]);
    renderNames();

    const result = data.result;
    if(result && result.session){
      if(result.session !== lastSession){
        lastSession = result.session;
        playResult(result.winner || '');
      } else if(!rolling){
        showResult(result.winner || '');
      }
    }
  }, err=>{
    toast('连接失败，请检查网络或配置');
  });

  const JIYU = ['好运爆棚，锦鲤附体', '万事胜意，好运连连', '福气满满，心愿达成', '天选之人，喜从天降', '手气爆棚，惊喜不断'];
  function showResult(name){
    resultName.textContent = name || '—';
    resultName.classList.add('show');
    statusEl.textContent = name ? '🎉 中奖者' : '暂无结果';
    $('resultSub').textContent = name ? JIYU[(Math.random()*JIYU.length)|0] : '';
    if(name){ if(navigator.vibrate) navigator.vibrate(80); celebrate(); }
  }

  function playResult(winner){
    if(!names.length){ showResult(winner); return; }
    rolling = true;
    statusEl.textContent = '抽签中…';
    resultName.classList.remove('show');
    const total = 2600;
    const start = performance.now();
    let last = -1;
    function tick(){
      const el = performance.now() - start;
      if(el < total){
        let i = (Math.random()*names.length)|0;
        if(i===last && names.length>1) i=(i+1)%names.length;
        last = i;
        resultName.textContent = names[i];
        setTimeout(tick, 45 + (el/total)*380);
      } else {
        rolling = false;
        showResult(winner);
      }
    }
    tick();
  }

  function doDraw(){
    if(!names.length){ toast('还没有参与者'); return; }
    let winner;
    if(riggedEnabled && riggedName && names.includes(riggedName)){
      winner = riggedName;
    } else {
      winner = names[(Math.random()*names.length)|0];
    }
    const session = Date.now() + '-' + (Math.random()+'').slice(2,6);
    // 只把「结果」写入云端，内定配置不上传
    roomRef.set({ result: { session, winner, ts: Date.now() } }, { merge: true })
      .catch(e=>toast('抽签失败：'+e.message));
  }
  $('drawFullBtn').onclick=doDraw;

  function resetAll(){
    if(!confirm('确定清空名单并重置抽签结果吗？')) return;
    roomRef.set({ participants: {}, result: {} })
      .then(()=>toast('已清空'))
      .catch(e=>toast(e.message));
  }
  $('resetBtn').onclick=resetAll;

  // ---- 彩带特效 ----
  function celebrate(){
    const canvas=$('confetti'); const ctx=canvas.getContext('2d');
    canvas.width=innerWidth; canvas.height=innerHeight;
    const colors=['#ff6b6b','#feca57','#48dbfb','#1dd1a1','#ff9ff3','#54a0ff'];
    const pieces=[];
    for(let i=0;i<140;i++){
      pieces.push({x:Math.random()*canvas.width,y:-20-Math.random()*canvas.height,
        w:6+Math.random()*6,h:10+Math.random()*8,c:colors[(Math.random()*colors.length)|0],
        vy:2+Math.random()*3,vx:-1.5+Math.random()*3,rot:Math.random()*Math.PI,vr:-0.15+Math.random()*0.3});
    }
    (function frame(){
      ctx.clearRect(0,0,canvas.width,canvas.height);
      let alive=false;
      pieces.forEach(p=>{ p.y+=p.vy;p.x+=p.vx;p.rot+=p.vr;
        if(p.y<canvas.height+40) alive=true;
        ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.c;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore();
      });
      if(alive) requestAnimationFrame(frame); else ctx.clearRect(0,0,canvas.width,canvas.height);
    })();
  }

  function toast(msg){
    const t=$('toast'); t.textContent=msg; t.style.opacity='1';
    clearTimeout(t._t); t._t=setTimeout(()=>t.style.opacity='0',1800);
  }

  // ---- 内定选择下拉框动态更新 ----
  function updateRiggedSelect(){
    const sel=$('riggedSelect');
    sel.innerHTML='';
    names.forEach(n=>{ const o=document.createElement('option'); o.value=n; o.textContent=n; sel.appendChild(o); });
    if(riggedName) sel.value=riggedName;
  }

  function updateRemoveSelect(){
    const sel=$('removeSelect');
    sel.innerHTML='';
    names.forEach(n=>{ const o=document.createElement('option'); o.value=n; o.textContent=n; sel.appendChild(o); });
  }

  function removeParticipant(){
    const name=$('removeSelect').value;
    if(!name){ toast('请选择要删除的人'); return; }
    roomRef.update({ ['participants.'+name]: firebase.firestore.FieldValue.delete() })
      .then(()=>toast('已删除 '+name))
      .catch(e=>toast('删除失败：'+e.message));
  }
  $('removeBtn').onclick=removeParticipant;

  // ---- 秘密入口：长按标题约 2 秒 ----
  const pinOverlay=$('pinOverlay'), pinInput=$('pinInput'), pinErr=$('pinerror');
  let holdTimer;
  $('title').addEventListener('pointerdown',()=>{ holdTimer=setTimeout(openPinGate,1800); });
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>$('title').addEventListener(ev,()=>clearTimeout(holdTimer)));
  function openPinGate(){ pinOverlay.classList.remove('hidden'); pinInput.value=''; pinErr.textContent=''; }

  const secretOverlay=$('secretOverlay');
  function getPin(){ return localStorage.getItem(LS_PIN)||defaultPin; }

  $('pinCancel').onclick=()=>pinOverlay.classList.add('hidden');
  $('pinOk').onclick=()=>{
    if(pinInput.value===getPin()){ pinOverlay.classList.add('hidden'); openSecret(); }
    else pinErr.textContent='密码错误';
  };
  pinInput.addEventListener('keydown',e=>{ if(e.key==='Enter') $('pinOk').click(); });

  function openSecret(){
    $('riggedToggle').checked=riggedEnabled;
    updateRiggedSelect();
    $('newPin').value='';
    secretOverlay.classList.remove('hidden');
  }
  $('secretCancel').onclick=()=>secretOverlay.classList.add('hidden');
  $('riggedToggle').onchange=e=>{
    riggedEnabled=e.target.checked;
    localStorage.setItem(LS_RIG, riggedEnabled?'1':'0');
  };
  $('riggedSelect').onchange=e=>{
    riggedName=e.target.value;
    localStorage.setItem(LS_RIGNAME, riggedName);
  };
  $('newPin').addEventListener('change',e=>{
    const np=e.target.value.trim();
    if(np) localStorage.setItem(LS_PIN, np);
  });

  renderNames();
})();
</script>
</body>
</html>
